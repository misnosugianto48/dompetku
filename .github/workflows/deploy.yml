name: Deploy Dompetku to Shared Hosting

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dompetku_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: none

    - name: Copy .env for Testing
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies (Dev for Testing)
      run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

    - name: Generate Key
      run: php artisan key:generate

    - name: Run Pest Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: dompetku_test
        DB_USERNAME: postgres
        DB_PASSWORD: password
        DB_SSLMODE: disable
      run: php artisan test --compact

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM dependencies & Build Assets
      run: |
        npm ci
        npm run build

    - name: Deploy to Server via Rsync SSH
      uses: easingthemes/ssh-deploy@main
      env:
        REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: "-rlgoDzvc -i --delete"
        SOURCE: "./"
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        TARGET: ${{ secrets.REMOTE_TARGET_DIR }}
        # /vendor/ ditambahkan ke EXCLUDE agar tidak ditransfer via Rsync
        EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, /.env, /storage/framework/cache/data/*, /storage/framework/sessions/*, /storage/framework/views/*.php, /storage/logs/*, /tests/"

    - name: Execute Remote Post-Deployment Commands
      uses: appleboy/ssh-action@master
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        RECEIPT_DISK: ${{ secrets.RECEIPT_DISK }}
        CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT || '22' }}
        envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,RECEIPT_DISK,CLOUDINARY_URL,CLOUDINARY_UPLOAD_PRESET
        script: |
          cd ${{ secrets.REMOTE_TARGET_DIR }}

          # Helper to safely set/update env variables in .env file
          upsert_env_var() {
            local key=$1
            local value=$2
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          # Ensure .env exists
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Inject Google credentials if provided
          if [ -n "$GOOGLE_CLIENT_ID" ]; then upsert_env_var "GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_ID"; fi
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then upsert_env_var "GOOGLE_CLIENT_SECRET" "$GOOGLE_CLIENT_SECRET"; fi
          if [ -n "$GOOGLE_REDIRECT_URI" ]; then upsert_env_var "GOOGLE_REDIRECT_URI" "$GOOGLE_REDIRECT_URI"; fi
          if [ -n "$RECEIPT_DISK" ]; then upsert_env_var "RECEIPT_DISK" "$RECEIPT_DISK"; fi
          if [ -n "$CLOUDINARY_URL" ]; then upsert_env_var "CLOUDINARY_URL" "$CLOUDINARY_URL"; fi
          if [ -n "$CLOUDINARY_UPLOAD_PRESET" ]; then upsert_env_var "CLOUDINARY_UPLOAD_PRESET" "$CLOUDINARY_UPLOAD_PRESET"; fi

          # Put application in maintenance mode
          php artisan down || true

          # Install production dependencies di server
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

          # Run database migrations
          php artisan migrate --force

          # Clear and optimize caches
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

          # Fix Permissions
          chmod -R 775 storage bootstrap/cache
          chmod +x artisan

          # Bring application back up
          php artisan up || true
